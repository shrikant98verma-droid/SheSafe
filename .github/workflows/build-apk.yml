name: Build SheSafe APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack SheSafe
        run: unzip -q "$(ls *.zip | head -1)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Flutter project and copy SheSafe into it
        working-directory: shesafe
        run: |
          flutter create --org com.shesafe --project-name shesafe app
          rm -rf app/lib app/test
          cp -r lib app/lib
          cp -r assets app/assets
          cp pubspec.yaml app/pubspec.yaml

      - name: Add Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > shesafe/app/android/app/google-services.json
            echo "Firebase enabled"
          else
            echo "No GOOGLE_SERVICES_JSON secret: building in demo mode"
          fi

      - name: Patch the Android project
        working-directory: shesafe
        run: python3 tools/prepare_android.py app
        
      - name: Raise compileSdk
        working-directory: shesafe/app/android/app
        run: |
          sed -i -E 's/compileSdk(Version)? *= *flutter\.compileSdkVersion/compileSdk = 36/' build.gradle.kts 2>/dev/null || true
          sed -i -E 's/compileSdk(Version)? +flutter\.compileSdkVersion/compileSdkVersion 36/' build.gradle 2>/dev/null || true
          grep -n compileSdk build.gradle*
              
      - name: Force newer compileSdk for all plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compilesdk.gradle << 'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
          }
          EOF 
          
      - name: Build the APK
        working-directory: shesafe/app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: shesafe-apk
          path: shesafe/app/build/app/outputs/flutter-apk/app-release.apk
